# ============================================================
# INSTRUMENT IDENTITY
# ============================================================
vendor: Keysight
model: "34461A"
mode: dut
idn: "Keysight TECHNOLOGIES,34461A,MOCK12345,A.02.10"
default_target: 1.0
noise: 0.001
offset: 0.0
fail_rate: 0.0

# ============================================================
# COMMAND RESPONSES
# ============================================================
# Common commands such as *IDN?, *ESR?, *OPC?, and SYST:ERR? are handled
# centrally by MockInstrument and security/policy_loader.py. They are not
# repeated here.
# ============================================================
responses:
  "READ?": null  # Dynamic — generated based on target
  "CONF:VOLT:DC": ""
  "SENS:VOLT:DC:NPLC 1": ""

# ============================================================
# WRITE COMMANDS
# ============================================================
# Common writes such as *RST and *CLS are handled centrally by
# MockInstrument and security/policy_loader.py. They are not repeated here.
# ============================================================
write_commands:
  - "CONF:VOLT:DC"
  - "SENS:VOLT:DC:NPLC 1"