# File: config/instruments/rs_rtc1002.yaml
# Path: /d/Projects/autocalbridge/config/instruments/rs_rtc1002.yaml
# Purpose: Capability profile for R&S RTC1002 oscilloscope.
#          Contains identity and basic SCPI commands for connectivity,
#          visual verification, and safe control.
#          Includes measurement setup and result query commands for
#          digital comparison during concept validation.
#          Does NOT fix deployment role; role is assigned at runtime.

# ============================================================
# PROFILE AUTHENTICITY STATUS
# ============================================================
profile_status: placeholder_unverified

source_document:
  title: "R&S RTC1000 Series User Manual"
  document_number: ""
  version: ""
  url: ""
  section: ""

# ============================================================
# INSTRUMENT IDENTITY
# ============================================================
vendor: Rohde & Schwarz
model: "RTC1002"
idn: "Rohde&Schwarz,RTC1002,0000000000000,00.000"

# ============================================================
# COMMAND RESPONSES
# ============================================================
# Common commands such as *IDN?, *ESR?, *OPC?, and SYST:ERR? are handled
# centrally by MockInstrument and security/policy_loader.py.
# ============================================================
responses:
  "SYST:ERR:ALL?": "0,\"No error\""
  "CHAN1:SCAL?": "5.00E-03"
  "MEAS1:RES?": ""

# ============================================================
# WRITE COMMANDS
# ============================================================
# Common writes such as *RST and *CLS are handled centrally.
# These command roots are allowed for physical and virtual RTC1002 use.
# Abbreviated forms are matched as roots by CommandPolicy.
# ============================================================
write_commands:
  - "ACQ:STAT"
  - "CHAN1:STAT"
  - "CHAN1:SCAL"
  - "CHAN2:STAT"
  - "CHAN2:SCAL"
  - "TIM:SCAL"
  - "TIM:POS"
  - "MEAS1:ENAB"
  - "MEAS1:MAIN"
  - "MEAS1:SOUR"
  - "CURS1:STAT"
  - "CURS1:FUNC"
  - "AUT"
  - "DISP:GRID:STYL"
  - "DISP:PERS:STAT"